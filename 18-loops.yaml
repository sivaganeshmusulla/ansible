- name: install packages
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: install packages using loop
    ansible.builtin.package:
      name: "{{ item.name }}"
      state: "{{ item.state }}"
    loop: #list of map
      - {name: "mysql", state: "absent"} #map/dict
      - {name: "nginx", state: "present"}
      - {name: "vim", state: "present"}
      - {name: "tree", state: "present"}